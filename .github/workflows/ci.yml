name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Diagonal matrix: cover both OSes AND both supported-Python endpoints in
      # two jobs. 3.10 (Linux) exercises the oldest version + the tomli fallback;
      # 3.13 (Windows) covers the newest version + OS-specific paths/encoding.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [full] so every optional feature (semantic + llm providers) is
          # exercised; core stays light for end users via the split extras.
          pip install -e ".[dev,full]"

      - name: Run tests
        run: pytest -m "not slow" -q

      - name: Check CLI entry point
        run: promptry --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check promptry/

  dashboard:
    # Build the dashboard UI from source on every change. Both the shipped
    # dashboard (promptry/dashboard/static) and the marketing demo (docs/demo)
    # are the SAME dashboard-ui source compiled with/without DEMO=1 — building
    # both here proves neither target has broken, so they can't silently diverge.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shipped dashboard
        run: npm run build          # -> ../promptry/dashboard/static

      - name: Build demo (DEMO=1)
        run: npm run build:demo
        env:
          DEMO: "1"

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promptry-js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
