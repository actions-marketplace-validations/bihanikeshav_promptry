[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptry"
version = "1.0.6"
description = "Regression protection for LLM pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Keshav", email = "keshav@meownikov.xyz"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "prompts", "regression", "testing", "eval", "drift"]

# Core stays deliberately small: CLI, prompt registry, deterministic
# assertions (exact/text/schema/json/rouge/levenshtein), drift, cost tracking
# from the bundled price snapshot, the local dashboard, and the MCP server.
# Anything that pulls torch-sized weights or a provider SDK lives in an extra.
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "watchfiles>=0.21.0",
    "pyyaml>=6.0",
    # Dashboard ships in core -- it's a thin FastAPI app over the local SQLite
    # DB, no heavy transitive deps.
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
# Semantic assertions, embedding-distance, RAG context retrieval, and failure
# clustering. Pulls sentence-transformers (torch) + chromadb -- the heavy set.
semantic = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.5.0",
]
# Running real model completions, assert_llm judging, and live price refresh.
llm = [
    "litellm>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
]
# Everything -- restores the pre-0.10 "batteries included" install.
full = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.5.0",
    "litellm>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
]

[project.scripts]
promptry = "promptry.cli:main"

[project.urls]
Homepage = "https://promptry.meownikov.xyz"
Documentation = "https://promptry.meownikov.xyz/docs.html"
Repository = "https://github.com/bihanikeshav/promptry"
Issues = "https://github.com/bihanikeshav/promptry/issues"

[tool.setuptools.packages.find]
include = ["promptry*"]

[tool.setuptools.package-data]
"promptry.dashboard" = ["static/**/*"]
"promptry.data" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that need the embedding model downloaded",
    "integration: tests that require a running Ollama + ChromaDB (see integration_tests/)",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their submodules' public API; those imports
# are intentional, not dead (e.g. promptry/assertions/__init__.py after the
# package split).
"__init__.py" = ["F401"]
