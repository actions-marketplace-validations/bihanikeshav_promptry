[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptry"
version = "1.0.2"
description = "Regression protection for LLM pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Keshav", email = "keshav@meownikov.xyz"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "prompts", "regression", "testing", "eval", "drift"]

dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "watchfiles>=0.21.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "openai>=1.0.0",
    "litellm>=1.0.0",
    "anthropic>=0.25.0",
    "pyyaml>=6.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
semantic = []
dashboard = []
openai = []
litellm = []
anthropic = []
dataset-gen = []
integration = []
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
]

[project.scripts]
promptry = "promptry.cli:main"

[project.urls]
Homepage = "https://promptry.meownikov.xyz"
Documentation = "https://promptry.meownikov.xyz/docs.html"
Repository = "https://github.com/bihanikeshav/promptry"
Issues = "https://github.com/bihanikeshav/promptry/issues"

[tool.setuptools.packages.find]
include = ["promptry*"]

[tool.setuptools.package-data]
"promptry.dashboard" = ["static/**/*"]
"promptry.data" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that need the embedding model downloaded",
    "integration: tests that require a running Ollama + ChromaDB (see integration_tests/)",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their submodules' public API; those imports
# are intentional, not dead (e.g. promptry/assertions/__init__.py after the
# package split).
"__init__.py" = ["F401"]
