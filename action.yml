name: "promptry eval"
description: "Run promptry eval suites in CI. Catches LLM regressions and comments on PRs."

branding:
  icon: check-circle
  color: orange

inputs:
  suite:
    description: "Eval suite to run"
    required: true
  module:
    description: "Python module containing the eval suite"
    required: true
  compare:
    description: "Baseline to compare against (e.g. prod)"
    required: false
    default: ""
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  extras:
    description: "pip extras to install with promptry"
    required: false
    default: "semantic"
  version:
    description: "Pin a specific promptry version (e.g. 1.0.8). Empty installs the latest."
    required: false
    default: ""
  pr-comment:
    description: "Post a comment on the PR with results (default: true)"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for posting PR comments"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install promptry
      shell: bash
      env:
        # Passed via env (never interpolated into the script body) so a
        # crafted input value can't break out into shell commands.
        EXTRAS: ${{ inputs.extras }}
        VERSION: ${{ inputs.version }}
      run: |
        spec="promptry"
        if [ -n "$EXTRAS" ]; then spec="promptry[$EXTRAS]"; fi
        if [ -n "$VERSION" ]; then spec="$spec==$VERSION"; fi
        pip install "$spec"

    - name: Install project dependencies
      shell: bash
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f pyproject.toml ]; then
          pip install -e .
        fi

    - name: Run eval suite
      id: eval
      shell: bash
      env:
        # All caller-controlled values arrive via env, never interpolated
        # into the script — this is GitHub's documented defense against
        # shell/script injection from untrusted inputs.
        SUITE: ${{ inputs.suite }}
        MODULE: ${{ inputs.module }}
        COMPARE: ${{ inputs.compare }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        MD_FILE="${RUNNER_TEMP}/promptry-summary.md"
        HTML_FILE="${RUNNER_TEMP}/promptry-report.html"

        # Build the argv as an array so each value stays a single, safely
        # quoted argument (no word-splitting, no injection).
        args=(run "$SUITE" --module "$MODULE")
        if [ -n "$COMPARE" ]; then args+=(--compare "$COMPARE"); fi

        # Run the suite. On PRs we also generate a Markdown summary and
        # HTML report so the follow-up step can post a comment. We never
        # want the comment step skipped just because the eval regressed,
        # so we capture the exit code and re-raise it at the end.
        if [ "$PR_COMMENT" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
          args+=(--markdown "$MD_FILE" --output "$HTML_FILE")
        fi

        set +e
        promptry "${args[@]}"
        EVAL_EXIT=$?
        set -e

        echo "MD_FILE=$MD_FILE" >> $GITHUB_ENV
        echo "HTML_FILE=$HTML_FILE" >> $GITHUB_ENV
        echo "eval_exit=$EVAL_EXIT" >> $GITHUB_OUTPUT

    - name: Post PR comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = process.env.MD_FILE;
          if (!path || !fs.existsSync(path)) {
            core.info(`No promptry markdown summary at ${path}, skipping comment.`);
            return;
          }
          const body = fs.readFileSync(path, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          if (!issue_number) {
            core.info('No PR number in context; skipping comment.');
            return;
          }

          // Update an existing promptry comment if one exists, otherwise
          // create a new one. This prevents comment spam on repeated pushes.
          const comments = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });
          const marker = '_Generated by [promptry]';
          const existing = comments.data.find(c => (c.body || '').includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
          }

    - name: Propagate eval exit code
      if: always()
      shell: bash
      run: |
        EXIT="${{ steps.eval.outputs.eval_exit }}"
        if [ -z "$EXIT" ]; then EXIT=0; fi
        exit "$EXIT"
